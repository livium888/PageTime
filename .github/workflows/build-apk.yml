name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check release signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64; refusing to build an APK that may not update the installed app."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing KEYSTORE_PASSWORD."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing KEY_ALIAS."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing KEY_PASSWORD."; exit 1; }

      - name: Build signed release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      # Every run used to publish the artifact under the same name, so the
      # downloaded file could not say which build it was and an older run's APK
      # was indistinguishable from the newest one. Naming it for the app version
      # and the commit makes the file itself the answer to "which build is on my
      # phone?" — Settings shows the same version string.
      - name: Name this build
        id: build-name
        run: |
          VERSION=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$VERSION" ] || VERSION=unknown
          echo "name=pagetime-${VERSION}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-name.outputs.name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The workflow artifact above needs an authenticated API call to fetch
      # (the "Download" button on the run page works from a logged-in
      # browser, but the raw artifact URL does not, and either way it's a
      # zip that has to be unzipped for the one file inside it). A GitHub
      # Release asset has a plain, stable URL that downloads directly on
      # click — so this republishes the same APK there under a fixed
      # filename, at a fixed tag, updated on every push to main. The
      # filename has to stay identical across builds for the URL itself to
      # stay the same; the version and commit are in the release notes
      # instead, and still in the file itself (Settings screen).
      - name: Publish the one-click download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk pagetime-latest.apk
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk pagetime-latest.apk \
            --title "Latest build (${{ steps.build-name.outputs.name }})" \
            --notes "Always the newest successful build from main — currently ${{ steps.build-name.outputs.name }}, commit ${{ github.sha }}. Not a versioned release: the file at this link changes on every push." \
            --latest
