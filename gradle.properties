# The Freebuff build sandbox caps memory at 4 GB. R8 (release builds) needs
# the daemon heap headroom below. Kotlin compiles in its own daemon (sequential
# with R8, so the two heavy phases never overlap in memory); file watching is
# disabled because the extra watcher JVM pushed builds over the cap.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=160m -Dfile.encoding=UTF-8
org.gradle.vfs.watch=false
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
