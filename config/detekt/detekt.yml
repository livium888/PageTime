# Detekt configuration.
#
# This config is used WITHOUT the default rule set (the same effect as
# buildUponDefaultConfig = false, which is a Gradle plugin property, not a
# config key). The project uses Compose (generated, state-heavy code) and
# already has a lint + ktlint story; detekt exists here for one specific job:
# catching unused/wildcard imports in CI — with zero surprise failures from
# rules that don't fit this codebase.

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false
  excludes: ''

build:
  maxIssues: 0

processors:
  active: false

style:
  UnusedImports:
    active: true
  WildcardImport:
    active: true